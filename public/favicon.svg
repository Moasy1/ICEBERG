<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="icebergGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="deepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
  </defs>
  <!-- Background circle with dark navy tone -->
  <rect width="128" height="128" rx="28" fill="#020617" />
  <!-- Border subtle highlight -->
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2" />
  <!-- Growth arrow on top -->
  <path d="M52 26 L64 12 L76 26 M64 14 L64 36" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Iceberg tip above water -->
  <path d="M64 36 L40 60 L88 60 Z" fill="url(#icebergGrad)" stroke="#e0f2fe" stroke-width="2" stroke-linejoin="round" />
  <!-- Waterline -->
  <line x1="20" y1="62" x2="108" y2="62" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 0" />
  <!-- Iceberg submerged body -->
  <path d="M40 64 L28 88 L64 116 L100 88 L88 64 Z" fill="url(#deepGrad)" stroke="#0ea5e9" stroke-width="2" stroke-linejoin="round" />
  <!-- Internal neural network lines -->
  <path d="M40 64 L64 82 L88 64 M28 88 L64 82 L100 88 M64 82 L64 116" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
  <!-- Network nodes -->
  <circle cx="64" cy="82" r="4" fill="#38bdf8" />
  <circle cx="46" cy="74" r="3" fill="#7dd3fc" />
  <circle cx="82" cy="74" r="3" fill="#7dd3fc" />
  <circle cx="48" cy="98" r="3" fill="#0ea5e9" />
  <circle cx="80" cy="98" r="3" fill="#0ea5e9" />
</svg>
