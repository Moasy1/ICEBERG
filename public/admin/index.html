                                <input type="url" id="edit-audit-link-fb" class="form-input w-full px-3 py-1.5 rounded-lg text-xs bg-slate-800 text-white font-mono" placeholder="https://facebook.com/...">
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-pink-400 mb-1">📸 Instagram Profile URL</label>
                                <input type="url" id="edit-audit-link-ig" class="form-input w-full px-3 py-1.5 rounded-lg text-xs bg-slate-800 text-white font-mono" placeholder="https://instagram.com/...">
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-emerald-400 mb-1">💼 LinkedIn Page URL</label>
                                <input type="url" id="edit-audit-link-li" class="form-input w-full px-3 py-1.5 rounded-lg text-xs bg-slate-800 text-white font-mono" placeholder="https://linkedin.com/company/...">
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-[10px] font-semibold text-red-400 mb-1">▶️ YouTube Channel URL</label>
                                <input type="url" id="edit-audit-link-yt" class="form-input w-full px-3 py-1.5 rounded-lg text-xs bg-slate-800 text-white font-mono" placeholder="https://youtube.com/c/...">
                            </div>
                        </div>
                    </div>

                    <!-- Score Breakdown -->
                    <div class="mt-3">
                        <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Audit Score Breakdown (0-25 each)</label>
                        <div class="grid grid-cols-4 gap-3">
                            <div>
                                <label class="block text-[10px] font-semibold text-indigo-400 mb-1">🎨 Visual Identity</label>
                                <input type="number" id="edit-audit-bd-visual" min="0" max="25" class="form-input w-full px-3 py-1.5 rounded-lg text-xs bg-slate-800 text-white font-mono" placeholder="18">
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-amber-400 mb-1">⚡ Content Velocity</label>
                                <input type="number" id="edit-audit-bd-velocity" min="0" max="25" class="form-input w-full px-3 py-1.5 rounded-lg text-xs bg-slate-800 text-white font-mono" placeholder="13">
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-emerald-400 mb-1">💬 Engagement Quality</label>
                                <input type="number" id="edit-audit-bd-engagement" min="0" max="25" class="form-input w-full px-3 py-1.5 rounded-lg text-xs bg-slate-800 text-white font-mono" placeholder="13">
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-red-400 mb-1">📢 Ad Infrastructure</label>
                                <input type="number" id="edit-audit-bd-ads" min="0" max="25" class="form-input w-full px-3 py-1.5 rounded-lg text-xs bg-slate-800 text-white font-mono" placeholder="14">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-800">
                    <button type="button" onclick="closeAllModals()" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold rounded-lg">Cancel</button>
                    <button type="submit" class="btn-primary px-6 py-2 text-white text-xs font-bold rounded-lg">Save Audit Record</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- IDEX MODAL 03: ADD / EDIT LEAD FORM       -->
    <!-- ========================================== -->
    <div id="idex-lead-modal" class="fixed inset-0 flex items-start sm:items-center justify-center z-50 hidden overflow-y-auto p-4">
        <div class="glass-card rounded-xl p-6 w-full max-w-2xl max-h-[90vh] overflow-y-auto relative my-auto bg-slate-950 border border-slate-800">
            <button type="button" onclick="closeAllModals()" aria-label="Close" class="absolute top-4 right-4 text-gray-400 hover:text-white p-2 rounded-full bg-slate-800 border border-slate-700">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
            <h3 class="text-xl font-bold text-white mb-4" id="lead-form-title">Add IDEX Exhibitor Lead</h3>
            
            <form id="idex-lead-form" onsubmit="handleLeadSubmit(event)" class="space-y-4">
                <input type="hidden" id="edit-lead-id">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-1">Contact Name *</label>
                        <input type="text" id="edit-lead-name" class="form-input w-full px-3 py-2 rounded-lg text-sm bg-slate-800 text-white" required placeholder="Dr. Tarek Mansour">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-1">Company Name *</label>
                        <input type="text" id="edit-lead-company" class="form-input w-full px-3 py-2 rounded-lg text-sm bg-slate-800 text-white" required placeholder="Egypt Dental Co.">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-1">Email Address</label>
                        <input type="email" id="edit-lead-email" class="form-input w-full px-3 py-2 rounded-lg text-sm bg-slate-800 text-white" placeholder="tarek@egyptdental.com">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-1">Phone Number / WhatsApp</label>
                        <input type="text" id="edit-lead-phone" class="form-input w-full px-3 py-2 rounded-lg text-sm bg-slate-800 text-white" placeholder="+20 100 123 4567">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-1">Industry / Sector</label>
                        <input type="text" id="edit-lead-industry" class="form-input w-full px-3 py-2 rounded-lg text-sm bg-slate-800 text-white" placeholder="Dental Equipment">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-1">Position / Title</label>
                        <input type="text" id="edit-lead-position" class="form-input w-full px-3 py-2 rounded-lg text-sm bg-slate-800 text-white" placeholder="Commercial Director">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-1">Pipeline Status</label>
                        <select id="edit-lead-status" class="form-input w-full px-3 py-2 rounded-lg text-sm bg-slate-800 text-white">
                            <option value="NEW">New Lead</option>
                            <option value="CONTACTED">Contacted</option>
                            <option value="QUALIFIED">Qualified</option>
                            <option value="SCHEDULED">Scheduled</option>
                            <option value="CONVERTED">Converted</option>
                            <option value="CLOSED">Closed</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-1">Requirements & Selected Services</label>
                    <textarea id="edit-lead-requirements" rows="3" class="form-input w-full px-3 py-2 rounded-lg text-sm bg-slate-800 text-white" placeholder="Rebranding, Website funnels, Media buying..."></textarea>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-800">
                    <button type="button" onclick="closeAllModals()" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold rounded-lg">Cancel</button>
                    <button type="submit" class="btn-primary px-6 py-2 text-white text-xs font-bold rounded-lg">Save Lead</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- IDEX MODAL 04: ADD / EDIT SLOT FORM       -->
    <!-- ========================================== -->
    <div id="idex-slot-modal" class="fixed inset-0 flex items-start sm:items-center justify-center z-50 hidden overflow-y-auto p-4">
        <div class="glass-card rounded-xl p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto relative my-auto bg-slate-950 border border-slate-800">
            <button type="button" onclick="closeAllModals()" aria-label="Close" class="absolute top-4 right-4 text-gray-400 hover:text-white p-2 rounded-full bg-slate-800 border border-slate-700">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
            <h3 class="text-xl font-bold text-white mb-4" id="slot-form-title">Manage Meeting Slot</h3>
            
            <form id="idex-slot-form" onsubmit="handleSlotSubmit(event)" class="space-y-4">
                <input type="hidden" id="edit-slot-id">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-1">Event Date *</label>
                        <input type="date" id="edit-slot-date" class="form-input w-full px-3 py-2 rounded-lg text-sm bg-slate-800 text-white" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-1">Time Slot *</label>
                        <input type="text" id="edit-slot-time" class="form-input w-full px-3 py-2 rounded-lg text-sm bg-slate-800 text-white" required placeholder="10:00 AM">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-1">Slot Status</label>
                        <select id="edit-slot-status" class="form-input w-full px-3 py-2 rounded-lg text-sm bg-slate-800 text-white">
                            <option value="AVAILABLE">AVAILABLE</option>
                            <option value="HELD">HELD</option>
                            <option value="BOOKED">BOOKED</option>
                            <option value="COMPLETED">COMPLETED</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-1">Session Desk / Owner</label>
                        <input type="text" id="edit-slot-owner" class="form-input w-full px-3 py-2 rounded-lg text-sm bg-slate-800 text-white" placeholder="Executive Desk 1">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-1">Booked Lead Email</label>
                    <input type="email" id="edit-slot-email" class="form-input w-full px-3 py-2 rounded-lg text-sm bg-slate-800 text-white" placeholder="client@company.com">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-1">Company Name</label>
                    <input type="text" id="edit-slot-company" class="form-input w-full px-3 py-2 rounded-lg text-sm bg-slate-800 text-white" placeholder="Dentaquick">
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-800">
                    <button type="button" onclick="closeAllModals()" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold rounded-lg">Cancel</button>
                    <button type="submit" class="btn-primary px-6 py-2 text-white text-xs font-bold rounded-lg">Save Time Slot</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/admin/admin.js"></script>
</body>

</html>
